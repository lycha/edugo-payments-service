# assumption-register.yaml — assumptions carrying revisit triggers.
# Appended from decisions.yaml (workshop 2026-09-21). Each must be re-checked when
# its revisit_when trigger fires.

assumptions:
  - id: ASM-1
    feature: payments
    statement: "Operator webhooks are at-least-once and HMAC-signed, with no operator-supplied idempotency key (we own dedup + idempotency)."
    revisit_when: "real PayU contract obtained / before first live integration"
    source: decisions.yaml#Q-2
    captured_at: 2026-09-21
    status: open

  - id: ASM-2
    feature: payments
    statement: "A charge with no operator confirmation expires after 72h (PENDING → EXPIRED)."
    revisit_when: "ops confirms/observes real operator confirmation latencies"
    source: decisions.yaml#ABS-2
    captured_at: 2026-09-21
    status: open   # value ratified in session; still a tunable policy number

  - id: ASM-3
    feature: payments
    statement: >
      Dunning intervals 0/+3/+7/+10 → access block +14. Refined 2026-09-22 (FU-1/FU-2):
      comms send-window 09:00-20:00 Europe/Warsaw; exactly one message per step
      (incl. the +14 block notice) = 5 messages/cycle max (the ceiling IS the per-step count).
    revisit_when: "after M1 real collection data (arrears / collection-rate metrics, PRD §4) — the DAY-INTERVALS only; window+ceiling now decided"
    source: decisions.yaml#Q-6, decisions.yaml#ABS-8, decisions.yaml#FU-1, decisions.yaml#FU-2
    captured_at: 2026-09-21
    status: open   # intervals remain the tunable/assumed part

  - id: ASM-4
    feature: payments
    statement: "EduGo operates a central IdP that issues OIDC/JWT access tokens carrying sub, role, and acr/MFA claims, and exposes a JWKS endpoint — the actor-identity source ADR-0004 depends on."
    revisit_when: "confirm the platform's IdP + claim set with the platform team BEFORE implementing API auth (ADR-0004)"
    source: docs/adr/0004-api-auth.md, decisions.yaml#FU-7
    captured_at: 2026-09-21
    status: confirmed-for-exercise   # confirmed 2026-09-22 (FU-7); still re-verify with platform team before production auth rollout
