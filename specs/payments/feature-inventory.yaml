# feature-inventory.yaml
#
# SOURCE-TYPE NOTE (read first):
# This harvest was run against a PRD (docs/prd.md), NOT a prototype. A PRD is the
# inverse of a prototype: a prototype under-specifies (shows one happy path, hides
# the rest) while a PRD over-states (declares goals, FRs, invariants, but shows no
# UI). Consequences for this inventory:
#   - screens / states / interactions / filler are none-found — the source has no
#     markup, views, controls, or hardcoded sample content to observe.
#   - `evidence` points to docs/prd.md:<line-or-section>, not selectors/nodes.
#   - The value of this run is `data` (candidate entities), `transitions` (the
#     lifecycle state machine the PRD implies), and above all `absences` /
#     `questions` — what the PRD leaves undecided that an agent will otherwise invent.
#   - transition/state ids are DOMAIN-level (e.g. CHG-PENDING), not screen-level,
#     because there are no screens to anchor them to.
# confidence: observed = the term/rule is literally written in the PRD;
#             implied  = reasoned from the PRD (a review target, not a fact).

meta:
  feature: payments
  context: payments
  source:
    kind: prd                          # NOTE: not html|figma — see SOURCE-TYPE NOTE above
    repo: edugo-payments-service
    commit: 74d22fea62a7c95008501e9ccbe1468021b05f7c
    files: [docs/prd.md]
  glossary: null                       # no glossary.md found in the payments context — flagged
  harvested_at: 2026-09-20T17:33:49Z

