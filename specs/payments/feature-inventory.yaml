# ---------------------------------------------------------------------------
# THE POINT OF THE EXERCISE. Reframed for a backend payments PRD: not "what the
# UI hides" but "what the PRD leaves undecided that an agent will invent."
# Every one of the 12 checklist categories appears — populated or none-found+reason.

absences:
  # 1. Empty state
  - id: ABS-1
    category: empty-state
    description: >
      No first-ledger / zero-history behaviour defined. Undefined: does an account
      exist with a balance row at 0 before its first charge, or is the balance row
      created lazily on the first entry? INV-1 (balance == Σ entries) is trivially
      true at zero, but the read model for "account with no activity" is unspecified.
      An agent will pick lazy-vs-eager balance creation arbitrarily, which changes
      the reconciliation and read-path code.
    affects: [DAT-3, DAT-20]
    severity: high

  # 2. Error state
  - id: ABS-2
    category: error-state
    description: >
      Operator failure taxonomy is undefined. FR-6/DD-2 require exactly-once and
      out-of-order tolerance, but the PRD does not enumerate operator outcomes
      (declined, pending, expired, requires-SCA, timeout-then-late-success) nor the
      ledger/charge state each maps to. Also undefined: what a charge that never
      receives any operator confirmation eventually becomes (INV-3 says it must not
      be recorded, but not the terminal state or its timeout).
    affects: [DAT-11, TRN-2, TRN-3]
    severity: blocking

  # 3. Loading state
  - id: ABS-3
    category: loading-state
    description: none-found
    reason: >
      Loading/skeleton/spinner states are UI presentation concerns. The source is a
      backend PRD and this repo is a service (API + ledger) with no front-end. The
      backend analogue — in-flight/pending processing — is captured as lifecycle
      states (CHG-PENDING, OP-EVENT-RECEIVED) under transitions, not here.

  # 4. Permission and role
  - id: ABS-4
    category: permission
    description: >
      RBAC is asserted (NFR-6: RBAC + MFA + segregation of duties) but no permission
      matrix exists. Undefined per role (Parent / Admin / Accounting): who may issue
      refunds, post manual corrections/adjustments, override dunning/unblock access,
      resolve reconciliation mismatches, and view another payer's account. "Segregation
      of duties" implies maker/checker on corrections and refunds, but the approval
      flow and thresholds are unspecified. An agent will implement a single-actor path.
    affects: [DAT-18, DAT-14, DAT-16, TRN-7]
    severity: blocking

  # 5. Concurrency
  - id: ABS-5
    category: concurrency
    description: >
      Idempotency and unique keys are specified (FR-6, DD-2, INV-2), but concurrent
      writes to the same account balance are not. Undefined: the isolation/locking
      model when a webhook-driven PAYMENT and a manual ADJUSTMENT (or a refund and a
      chargeback on the same payment) commit simultaneously while INV-1 must hold. Also
      undefined: whether the materialized balance uses row-lock / serializable txn /
      optimistic retry. This directly threatens the balance invariant under the
      month-start burst.
    affects: [DAT-3, DAT-1, TRN-7, TRN-8]
    severity: blocking

  # 6. Boundary and scale
  - id: ABS-6
    category: boundary
    description: >
      Scale targets exist (A2 single-digit TPS, A3 ≥30% YoY, month-start burst) but
      per-account boundaries do not. Undefined: cap on ledger-entry history per account
      before balance materialization needs snapshotting; behaviour of allocation
      (FR-9, oldest-first) when an account has many open charges; pagination of
      ledger/history reads. An unbounded Σ-over-history balance recompute is a latent
      NFR-2 (p95<100ms balance read) violation at scale.
    affects: [DAT-3, DAT-12]
    severity: high

  # 7. Lifecycle
  - id: ABS-7
    category: lifecycle
    description: >
      Account/subscription end-of-life vs data retention is unspecified where two PRD
      rules collide. FR-3 prorates on cancellation and NFR-7 mandates 5-year financial
      retention reconciled with GDPR erasure (minor beneficiaries), but the PRD does not
      say what happens to an account's ledger, credit/wallet balance (DAT-13), or open
      arrears when a subscription is cancelled or a parent requests erasure. Soft vs hard
      delete, and what a residual credit/negative balance does on close, are undefined.
    affects: [DAT-5, DAT-13, DAT-20]
    severity: blocking

  # 8. Notification and side-effects
  - id: ABS-8
    category: notification
    description: >
      Dunning is "automated communication → access block" (A8, FR-13) and mismatches
      "→ alert" (FR-15), but the notification model is undefined: channel(s), cadence
      and number of dunning attempts before block, quiet-hours, the fatigue ceiling,
      and whether comms are batched vs per-event. Undefined too: who is notified on a
      reconciliation mismatch and at what severity. An agent will invent a retry/comms
      schedule that has direct revenue and churn consequences.
    affects: [DAT-14, DAT-16, TRN-4, TRN-5]
    severity: high

  # 9. Time
  - id: ABS-9
    category: time
    description: >
      Timezone and day-boundary governance is undefined despite being financially
      load-bearing. A6 fixes a shared "billing day" and FR-15 runs "daily" reconciliation,
      but neither states the timezone that defines the day boundary (Europe/Warsaw vs UTC
      vs operator settlement TZ), how DST transitions and month-length (28-31, billing on
      the 29th-31st) are handled, or the cutoff for assigning an operator event/settlement
      to a given reconciliation day. Open question 13.3 (billing-day edge cases, refunds
      crossing months) confirms this is unresolved.
    affects: [DAT-5, DAT-6, DAT-16, TRN-1, TRN-9]
    severity: blocking

  # 10. Offline and degraded network
  - id: ABS-10
    category: offline
    description: >
      Operator-downtime handling is named at the strategy level (Risk row: queue +
      retry/backoff, change-freeze, dual-operator fallback; DD-2 queue-buffered) but the
      concrete degraded-mode behaviour is undefined: retry/backoff limits and DLQ policy
      (NFR-9 mentions DLQ depth but no thresholds), the trigger and criteria for failing
      over to the second operator (FR-16/DD-5), and whether push payments are accepted
      while an operator is down. Client-side offline is N/A (backend service).
    affects: [DAT-11, DAT-17]
    severity: high

  # 11. Accessibility
  - id: ABS-11
    category: accessibility
    description: none-found
    reason: >
      Accessibility (keyboard paths, focus order, screen-reader announcements, colour
      semantics) is a UI concern. The source is a backend PRD and this repo has no
      front-end; a11y belongs to the consuming portal, out of this bounded context.

  # 12. Undo and reversibility
  - id: ABS-12
    category: undo
    description: >
      Reversibility rules are partially stated and partially missing. INV-4 mandates
      corrections via reversing entries (no in-place edit), and refund/chargeback exist
      (FR-10/11) — so the ledger is append-only-reversible. But undefined: whether a
      pull charge can be cancelled between initiation and operator confirmation; the
      window/authority to reverse a manual ADJUSTMENT; confirmation vs approval pattern
      for destructive back-office actions; and the blast radius of a bulk correction
      during a reconciliation-drift incident.
    affects: [DAT-1, TRN-7, TRN-8]
    severity: high

  # Role-variation (checklist category folded into permission, ABS-4) — recorded for completeness
  - id: ABS-13
    category: role-variation
    description: >
      Student is defined as a minor, GDPR-sensitive, non-payer beneficiary (persona,
      NFR-7), yet no rule states what student-linked data may appear on a payer's
      invoice, history, or audit log without violating data-minimisation for minors.
      The parent↔student↔account cardinality (A1: ~1.4-1.5 children/parent) is stated
      but its effect on balance ownership and invoice line-items is not.
    affects: [DAT-18, DAT-20, DAT-15]
    severity: high

# Genuine unknowns — could not be framed even as a scoped absence.
questions:
  - id: Q-1
    question: >
      What is the balance-bearing unit — one account per parent, per subscription, or
      per child? INV-1/FR-8 assume "account" but the PRD never fixes its grain.
    context: >
      Determines the schema's primary aggregate, how allocation (FR-9) and credit
      (DAT-13) scope, and whether one parent with multiple children has one balance or
      many. Every downstream table keys off this.
    blocks: [ABS-1, ABS-7, ABS-13]
  - id: Q-2
    question: >
      What are the operator's actual webhook guarantees (at-least-once? signed? their
      own idempotency keys?), settlement file format, and refund/chargeback/mandate APIs?
    context: >
      PRD Open Question 13.1 flags this as an external dependency. DD-2's HMAC-verify →
      enqueue → dedupe design and the entire reconciliation match (FR-15) cannot be built
      concretely until the operator contract is known.
    blocks: [ABS-2, ABS-10]
  - id: Q-3
    question: >
      What are the SALDEO and KSeF integration specifics (invoice format, handoff
      protocol, timing, error handling)?
    context: >
      PRD Open Question 13.2. FR-14/DD-7 depend on it; without it the invoice entity
      (DAT-15) and accounting handoff cannot be specified beyond "on demand".
    blocks: []
  - id: Q-4
    question: >
      What is the maker/checker (segregation-of-duties) workflow for refunds, manual
      corrections, and dunning/access overrides — approval steps, thresholds, and roles?
    context: >
      NFR-6 requires segregation of duties but defines no workflow. This is a permission +
      audit design decision (NFR-8) that shapes the API surface for back-office operations.
    blocks: [ABS-4, ABS-12]
  - id: Q-5
    question: >
      What is the canonical timezone / day-boundary for billing day and daily
      reconciliation, and how are month-length and DST edge cases (billing on 29-31,
      refunds crossing months) resolved?
    context: >
      PRD Open Question 13.3. Governs charge scheduling (TRN-1), reconciliation windows
      (TRN-9), and correctness of the "daily" match (FR-15).
    blocks: [ABS-9]
  - id: Q-6
    question: >
      What are the concrete dunning parameters — number and spacing of retry/comms
      attempts, the delay before access block, and what "recovery" restores?
    context: >
      A8/FR-13 name the flow but not the schedule. Directly affects collection rate and
      arrears metrics (Section 4) and the churn/revenue trade-off.
    blocks: [ABS-8]
