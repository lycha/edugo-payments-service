      here. Front-end screens are also out of scope for this repo, which is a
      backend payments service (API + ledger).
    evidence: "docs/prd.md:54-60 (personas listed; no views defined)"

states: []                             # no screens → no screen states to observe
interactions: []                       # no controls/markup in the source
