    revisit_when: "real PayU contract obtained / before first live integration"
    source: Q-2
  - id: ASM-2
    statement: "A charge with no operator confirmation expires after 72h (PENDING → EXPIRED)."
    capture_confidence: explicit   # value ratified in session; still a tunable policy number
    revisit_when: "ops confirms/observes real operator confirmation latencies"
    source: ABS-2
  - id: ASM-3
    statement: >
      Dunning intervals 0/+3/+7/+10 → block +14. Send-window and ceiling made concrete
      2026-09-22 (FU-1/FU-2): comms only 09:00-20:00 Europe/Warsaw; exactly one message
      per step (Day 0/+3/+7/+10 + the +14 block notice) = 5 messages/cycle max — the
      "fatigue ceiling" is that per-step count, not an independent cap.
    capture_confidence: explicit   # DAY-INTERVALS still the tunable part; window+ceiling now decided
    revisit_when: "after M1 real collection data (arrears / collection-rate metrics) — the day-intervals only"
    source: [Q-6, ABS-8]

