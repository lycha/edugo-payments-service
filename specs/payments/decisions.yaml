    finding: "Parent → child sub-account → class enrollment hierarchy. Harvest modelled a flat 'account' (DAT-20); real model is a two-level aggregate. New entities: child sub-account, enrollment."
    action: "Added to feature-inventory.yaml (DAT-21, DAT-22); DAT-20 updated to the decided model."
  - id: OFF-2
    finding: "Teacher payments — not in the PRD at all. Surfaced as the original justification for per-student/per-class balances."
    action: "Ruled OUT of scope this exercise; charge-level attribution retained for a future payout feature."
  - id: NEW-DEBT-1
    finding: "The recurring billing run must be single-runner-safe across clustered k8s pods (leader election / advisory lock / dedupe on (subscription, billing_period)) to avoid double-charging."
    action: "→ CONSTRAINTS.md + tracker task."
  - id: CONSTRAINT-INFRA
    finding: "Predicted load ⇒ no DB read-replicas and no balance snapshotting for M1. Service runs as stateless clustered pods; any pod handles any webhook; cross-pod at-most-once relies on DB-level dedup only (no in-memory dedup / pod affinity)."
    action: "→ CONSTRAINTS.md."

