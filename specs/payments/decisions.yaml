    statement: "Operator webhooks are at-least-once and HMAC-signed, with no operator-supplied idempotency key (we own dedup)."
    capture_confidence: explicit
    revisit_when: "real PayU contract obtained / before first live integration"
    source: Q-2
  - id: ASM-2
    statement: "A charge with no operator confirmation expires after 72h (PENDING → EXPIRED)."
    capture_confidence: explicit   # value ratified in session; still a tunable policy number
    revisit_when: "ops confirms/observes real operator confirmation latencies"
    source: ABS-2
  - id: ASM-3
    statement: "Dunning intervals 0/+3/+7/+10 → block +14 and fatigue ceiling ~5/cycle."
    capture_confidence: explicit   # schedule decided; intervals flagged tunable
    revisit_when: "after M1 real collection data (arrears / collection-rate metrics)"
    source: [Q-6, ABS-8]

